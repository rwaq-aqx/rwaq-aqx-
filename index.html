
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>AQX Central Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080d19;color:#f3f6ff;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:20px}
main{width:100%;max-width:440px}
header{text-align:center;margin-bottom:24px}
.logo{margin:auto auto 14px;width:62px;height:62px;border:1px solid #536da8;border-radius:18px;display:grid;place-items:center;font-size:23px;font-weight:bold;background:#152441}
h1{font-size:24px;margin:0 0 8px}
.sub,small{color:#9eacc5}
.card{background:#111a2b;border:1px solid #2a3953;border-radius:17px;padding:24px}
h2{font-size:19px;margin:0 0 8px}
p{font-size:13px;line-height:1.8;color:#aab8d0}
label{display:block;font-size:13px;margin:17px 0 8px}
input{width:100%;padding:14px;border-radius:9px;border:1px solid #35445e;background:#091222;color:white;font-size:15px;outline:none}
input:focus{border-color:#86a4ff}
button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:9px;background:#91aaff;color:#091225;font-weight:bold;font-size:14px;cursor:pointer}
button:disabled{opacity:.6}
.secondary{background:#24334d;color:white;margin-top:10px}
.msg{display:none;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;margin-top:16px;border-radius:9px;font-size:13px;line-height:1.8}
.msg.show{display:block}
.err{background:#451e2a;color:#ffdce1}
.ok{background:#12372c;color:#c8ffe2}
.info{background:#172b48;color:#d9e8ff}
.hidden{display:none!important}
#profile{margin-top:18px;padding:14px;border:1px solid #2a3953;border-radius:10px;line-height:2;overflow-wrap:anywhere}
footer{text-align:center;color:#7e8ba3;font-size:11px;margin-top:18px;line-height:1.8}
</style>
</head>
<body>
<main>
<header>
<div class="logo">AQX</div>
<h1>AQX Central Admin</h1>
<div class="sub">مركز الإدارة والتحكم المركزي</div>
</header>

<section class="card" id="loginPanel">
<h2>تسجيل دخول الإدارة</h2>
<p>أدخل بيانات حساب الإدارة المسجل في النظام.</p>
<form id="loginForm">
<label for="email">البريد الإلكتروني</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn" type="submit">تسجيل الدخول</button>
</form>
<div id="loginMsg" class="msg" role="status"></div>
</section>

<section class="card hidden" id="adminPanel">
<h2>لوحة الإدارة</h2>
<p>لا تظهر هذه اللوحة إلا بعد تأكيد الجلسة من المحرك.</p>
<div id="profile"></div>
<button class="secondary" id="verifyBtn" type="button">التحقق من الجلسة</button>
<button id="logoutBtn" type="button">تسجيل الخروج</button>
<div id="adminMsg" class="msg" role="status"></div>
</section>

<footer>ALQURMANI X · AQX Central Admin</footer>
</main>

<script>
"use strict";

const ENGINE_URL="https://script.google.com/macros/s/AKfycbzZ-gs-PiOLsSlov68EebKXORGHOQlfb1Htf9vUOGHJdSFsy5vMWIdKVtmoLM2jlmFf/exec";
const TOKEN_KEY="aqx_admin_session_token";

const $=id=>document.getElementById(id);
let busy=false;

function message(id,text,type="info"){
  const el=$(id);
  el.textContent=text;
  el.className="msg show "+type;
}
function clearMessage(id){
  $(id).textContent="";
  $(id).className="msg";
}
function showLogin(){
  $("loginPanel").classList.remove("hidden");
  $("adminPanel").classList.add("hidden");
}
function showAdmin(){
  $("loginPanel").classList.add("hidden");
  $("adminPanel").classList.remove("hidden");
}
function token(){
  return sessionStorage.getItem(TOKEN_KEY);
}
function saveToken(value){
  if(typeof value!=="string"||!value.trim()){
    throw Error("المحرك لم يُرجع session_token صالحًا.");
  }
  sessionStorage.setItem(TOKEN_KEY,value);
}
async function requestEngine(data){
  let response;
  try{
    response=await fetch(ENGINE_URL,{
      method:"POST",
      redirect:"follow",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify(data),
      cache:"no-store"
    });
  }catch(e){
    throw Error("تعذّر الاتصال بالمحرك أو قراءة رده من المتصفح. إذا كانت المشكلة CORS أو تحويل Google Apps Script فلن يستطيع كود الواجهة وحده تجاوزها. "+(e.message||""));
  }
  const raw=await response.text();
  let result;
  try{
    result=JSON.parse(raw);
  }catch(e){
    throw Error("رد المحرك ليس JSON صالحًا. قد تكون استجابة تحويل أو صفحة خطأ من Google.");
  }
  if(!response.ok)throw Error("HTTP "+response.status);
  return result;
}
function showProfile(data){
  const admin=data.admin||data.profile||{};
  const rows=[
    ["البريد",admin.email||$("email").value||"—"],
    ["المعرّف",admin.id||admin.admin_id||admin.firebase_uid||"—"],
    ["الحالة",admin.status||"الجلسة مؤكدة"],
    ["انتهاء الجلسة",data.expires_at||admin.expires_at||"وفق المحرك"]
  ];
  const box=$("profile");
  box.replaceChildren();
  rows.forEach(([label,value])=>{
    const line=document.createElement("div");
    const strong=document.createElement("strong");
    strong.textContent=label+": ";
    line.append(strong,document.createTextNode(String(value)));
    box.append(line);
  });
}
async function verifySession(){
  const current=token();
  if(!current){showLogin();return false;}
  try{
    const result=await requestEngine({
      action:"verify_session",
      session_token:current
    });
    if(!result||result.ok!==true){
      sessionStorage.removeItem(TOKEN_KEY);
      showLogin();
      message("loginMsg",result?.message||result?.error||"الجلسة غير صالحة. سجّل الدخول مجددًا.","err");
      return false;
    }
    showProfile(result);
    showAdmin();
    message("adminMsg","تم تأكيد الجلسة من المحرك.","ok");
    return true;
  }catch(e){
    message("adminMsg",e.message,"err");
    return false;
  }
}
$("loginForm").addEventListener("submit",async event=>{
  event.preventDefault();
  if(busy)return;
  clearMessage("loginMsg");
  busy=true;
  $("loginBtn").disabled=true;
  $("loginBtn").textContent="جارٍ التحقق...";
  try{
    const result=await requestEngine({
      action:"login",
      email:$("email").value.trim(),
      password:$("password").value
    });
    if(!result||result.ok!==true){
      message("loginMsg",result?.message||result?.error||"رفض المحرك تسجيل الدخول.","err");
      return;
    }
    saveToken(result.session_token);
    const verified=await verifySession();
    if(!verified){
      message("loginMsg","استلمت الواجهة نتيجة تسجيل الدخول، لكن لم ينجح التحقق من الجلسة. لا يمكن فتح لوحة الإدارة دون التحقق.","err");
    }
  }catch(e){
    message("loginMsg",e.message,"err");
  }finally{
    busy=false;
    $("loginBtn").disabled=false;
    $("loginBtn").textContent="تسجيل الدخول";
  }
});
$("verifyBtn").addEventListener("click",verifySession);
$("logoutBtn").addEventListener("click",async()=>{
  if(busy)return;
  busy=true;
  $("logoutBtn").disabled=true;
  try{
    if(token()){
      const result=await requestEngine({
        action:"logout",
        session_token:token()
      });
      if(!result||result.ok!==true){
        message("adminMsg",result?.message||result?.error||"المحرك لم يؤكد تسجيل الخروج.","err");
        return;
      }
    }
    sessionStorage.removeItem(TOKEN_KEY);
    showLogin();
    message("loginMsg","تم تسجيل الخروج.","ok");
  }catch(e){
    message("adminMsg","تعذّر تأكيد تسجيل الخروج: "+e.message,"err");
  }finally{
    if(!$("adminPanel").classList.contains("hidden")){
      $("logoutBtn").disabled=false;
    }
    busy=false;
  }
});
window.addEventListener("pageshow",()=>{
  if(token())verifySession();
  else showLogin();
});
</script>
</body>
</html>
