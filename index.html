<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - AQX Central Admin</title>
    <!-- تضمين مكتبة Tailwind CSS للتصميم السريع والعصري -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white mb-2">AQX Central Admin</h1>
            <p class="text-sm text-gray-400">لوحة التحكم المركزية - يرجى تسجيل الدخول</p>
        </div>
        
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">البريد الإلكتروني</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-blue-500 text-white" 
                    placeholder="admin@alqurmanix.com">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">كلمة المرور</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-blue-500 text-white" 
                    placeholder="••••••••">
            </div>

            <!-- رسائل الخطأ والنجاح -->
            <div id="errorMessage" class="hidden text-red-400 text-sm bg-red-900/30 p-3 rounded-lg border border-red-800 text-center"></div>
            <div id="successMessage" class="hidden text-green-400 text-sm bg-green-900/30 p-3 rounded-lg border border-green-800 text-center"></div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-lg transition duration-200 shadow-lg">
                تسجيل الدخول
            </button>
        </form>
    </div>

    <script>
        // رابط نشر الـ Web App الخاص بك على Google Apps Script
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPqUtLQFb5yYfTQcHDElI3ipxQoI0yW04n8s1Dj3XdS_oWSlMcIP7dDCbv57Q6_he-/exec";

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            // إخفاء الرسائل القديمة وتحديث حالة الزر
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري التحقق...';

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8' // لتجنب قيود الـ CORS في المتصفحات مع Google Apps Script
                    },
                    body: JSON.stringify({
                        action: 'login',
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    successDiv.textContent = 'تم تسجيل الدخول بنجاح! جاري التوجيه...';
                    successDiv.classList.remove('hidden');
                    
                    // حفظ رمز الجلسة وبيانات المسؤول في المتصفح للاستخدام المستقبلي
                    localStorage.setItem('aqx_session_token', data.session_token);
                    localStorage.setItem('aqx_admin_info', JSON.stringify(data.admin));
                    
                    // توجيه المستخدم بعد ثانية واحدة (يمكنك تغيير الصفحة المستهدفة لاحقاً)
                    setTimeout(() => {
                        window.location.href = 'dashboard.html'; 
                    }, 1000);
                } else {
                    throw new Error(data.message || 'بيانات الدخول غير صحيحة.');
                }
            } catch (err) {
                errorDiv.textContent = err.message || 'حدث خطأ أثناء الاتصال بالخادم.';
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'تسجيل الدخول';
            }
        });
    </script>
</body>
</html>
